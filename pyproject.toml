[project]
name = "rag-knowledge-worker"
version = "0.1.0"
description = "AI knowledge worker using RAG to become an expert on all company-related matters"
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "gradio>=6.29.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.6",
    "langchain-openai>=1.6.6",
    "langchain-text-splitters>=1.1.2",
    "litellm>=1.103.1",
    "openai>=2.54.0",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "scikit-learn>=1.9.1",
    "tenacity>=9.1.4",
    "tqdm>=4.70.1",
]

[project.scripts]
ingest-llm = "ingest_llm:main"
ingest-langchain = "ingest_langchain:main"
app = "app:main"
eval = "evaluation.evaluate:main"
evaluator = "eval_dashboard:main"
visualize = "visualize:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
